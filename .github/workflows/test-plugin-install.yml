name: Validate Plugin

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin manifest
        run: claude plugin validate .

      - name: Ensure plugin.json has no version field
        # Updates are keyed on the commit SHA; a version field would freeze users
        # on that version until it is bumped. See CONTRIBUTING.md "Releases".
        run: |
          if jq -e 'has("version")' .claude-plugin/plugin.json > /dev/null; then
            echo "::error file=.claude-plugin/plugin.json::Remove the \"version\" field — releases are tracked by commit SHA"
            exit 1
          fi

  validate-skills:
    name: Validate skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate skill structure and doc consistency
        run: ./scripts/validate-skills.sh
